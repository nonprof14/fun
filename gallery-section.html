<style>
  /* ============================================
     EISBEDARF GALLERY SECTION
     WordPress-embeddable component
     ============================================ */

  .eb-gallery {
    background-color: #ffffff;
    padding: 60px 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    box-sizing: border-box;
  }

  .eb-gallery *,
  .eb-gallery *::before,
  .eb-gallery *::after {
    box-sizing: border-box;
  }

  .eb-gallery__grid {
    display: flex;
    justify-content: center;
    gap: 15px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .eb-gallery__column {
    flex: 1;
    max-width: 400px;
    display: flex;
    flex-direction: column;
  }

  .eb-gallery__image-wrapper {
    width: 100%;
    overflow: hidden;
    flex-grow: 1;
  }

  .eb-gallery__image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .eb-gallery__caption {
    background-color: #d64545;
    height: 80px;
    display: flex;
    align-items: center;
    padding: 0 20px;
  }

  .eb-gallery__caption-text {
    color: #ffffff;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.4;
    text-align: left;
    margin: 0;
  }

  .eb-gallery__cta {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    margin-top: 50px;
    flex-wrap: wrap;
  }

  .eb-gallery__button {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .eb-gallery__button--primary {
    background-color: #d64545;
    color: #ffffff;
    padding: 16px 40px;
    border: none;
    border-radius: 0;
  }

  .eb-gallery__button--primary:hover {
    background-color: #b83a3a;
    color: #ffffff;
    text-decoration: none;
  }

  .eb-gallery__button--secondary {
    background-color: transparent;
    color: #222222;
    padding: 16px 10px;
    border: none;
  }

  .eb-gallery__button--secondary:hover {
    color: #d64545;
    text-decoration: none;
  }

  .eb-gallery__button--secondary:hover .eb-gallery__button-underline {
    background-color: #d64545;
  }

  .eb-gallery__button-underline {
    display: block;
    width: 100%;
    height: 2px;
    background-color: #222222;
    margin-top: 4px;
    transition: background-color 0.3s ease;
  }

  /* ============================================
     TABLET STYLES (768px - 1199px)
     ============================================ */
  @media (max-width: 1199px) {
    .eb-gallery {
      padding: 50px 30px;
    }

    .eb-gallery__grid {
      gap: 12px;
    }

    .eb-gallery__column:nth-child(3) {
      display: none;
    }

    .eb-gallery__column {
      max-width: 450px;
    }

    .eb-gallery__caption {
      height: 80px;
    }

    .eb-gallery__caption-text {
      font-size: 13px;
    }

    .eb-gallery__cta {
      margin-top: 40px;
      gap: 30px;
    }
  }

  /* ============================================
     MOBILE STYLES (below 768px)
     ============================================ */
  @media (max-width: 767px) {
    .eb-gallery {
      padding: 40px 20px;
    }

    .eb-gallery__grid {
      flex-direction: column;
      align-items: center;
    }

    .eb-gallery__column:nth-child(2),
    .eb-gallery__column:nth-child(3) {
      display: none;
    }

    .eb-gallery__column {
      max-width: 500px;
      width: 100%;
    }

    .eb-gallery__caption {
      height: 70px;
      padding: 0 15px;
    }

    .eb-gallery__caption-text {
      font-size: 13px;
    }

    .eb-gallery__cta {
      flex-direction: column;
      gap: 15px;
      margin-top: 35px;
    }

    .eb-gallery__button--primary {
      width: 100%;
      max-width: 320px;
      text-align: center;
      justify-content: center;
    }

    .eb-gallery__button--secondary {
      width: auto;
    }
  }

  /* ============================================
     SMALL MOBILE STYLES (below 480px)
     ============================================ */
  @media (max-width: 479px) {
    .eb-gallery {
      padding: 30px 15px;
    }

    .eb-gallery__caption {
      height: 70px;
      padding: 0 15px;
    }

    .eb-gallery__caption-text {
      font-size: 13px;
      line-height: 1.3;
    }

    .eb-gallery__cta {
      margin-top: 30px;
      gap: 12px;
    }

    .eb-gallery__button--primary {
      font-size: 12px;
      padding: 14px 30px;
      letter-spacing: 1.5px;
    }

    .eb-gallery__button--secondary {
      font-size: 12px;
      letter-spacing: 1.5px;
    }
  }
</style>
