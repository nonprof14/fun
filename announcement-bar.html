<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcement Bar - Eisbedarf</title>

  <!-- Google Fonts: Open Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================
       Eisbedarf Top Bar - Namespaced CSS
       ============================================ */

    /* CSS Custom Properties - Option B: Gold (Default) */
    :root {
      --eb-topbar-bg: #c9a227;
      --eb-topbar-text: #ffffff;
      --eb-topbar-link: #ffffff;
      --eb-topbar-link-hover: #333333;
      --eb-topbar-font: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --eb-topbar-height: 44px;
      --eb-topbar-font-size: 14px;
      --eb-topbar-transition: 0.2s ease;
    }

    /* Option A: Dark Background (uncomment to use)
    :root {
      --eb-topbar-bg: #333333;
      --eb-topbar-text: #ffffff;
      --eb-topbar-link: #ffffff;
      --eb-topbar-link-hover: #c9a227;
    }
    */

    /* Reset for standalone usage */
    .eb-topbar *,
    .eb-topbar *::before,
    .eb-topbar *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Main Top Bar */
    .eb-topbar {
      font-family: var(--eb-topbar-font);
      background-color: var(--eb-topbar-bg);
      color: var(--eb-topbar-text);
      min-height: var(--eb-topbar-height);
      display: flex;
      align-items: center;
      position: relative;
      z-index: 9999;
    }

    /* Hidden state for dismiss */
    .eb-topbar.eb-topbar--hidden {
      display: none;
    }

    /* Container */
    .eb-topbar__container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Content wrapper */
    .eb-topbar__content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Text */
    .eb-topbar__text {
      font-size: var(--eb-topbar-font-size);
      font-weight: 400;
      line-height: 1.4;
      text-align: center;
    }

    /* Highlight/emoji for visual interest */
    .eb-topbar__highlight {
      font-weight: 600;
    }

    /* CTA Link */
    .eb-topbar__cta {
      font-size: var(--eb-topbar-font-size);
      font-weight: 700;
      color: var(--eb-topbar-link);
      text-decoration: none;
      white-space: nowrap;
      padding: 6px 16px;
      border: 2px solid var(--eb-topbar-link);
      border-radius: 4px;
      transition: background-color var(--eb-topbar-transition),
                  color var(--eb-topbar-transition),
                  border-color var(--eb-topbar-transition);
    }

    .eb-topbar__cta:hover,
    .eb-topbar__cta:focus {
      background-color: var(--eb-topbar-link);
      color: var(--eb-topbar-bg);
      outline: none;
    }

    .eb-topbar__cta:focus-visible {
      outline: 2px solid var(--eb-topbar-link);
      outline-offset: 2px;
    }

    /* Close Button */
    .eb-topbar__close {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--eb-topbar-text);
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
      transition: opacity var(--eb-topbar-transition);
      border-radius: 4px;
    }

    .eb-topbar__close:hover,
    .eb-topbar__close:focus {
      opacity: 1;
      outline: none;
    }

    .eb-topbar__close:focus-visible {
      outline: 2px solid var(--eb-topbar-link);
      outline-offset: 2px;
    }

    .eb-topbar__close svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Responsive: Tablet */
    @media (max-width: 900px) {
      .eb-topbar__container {
        padding: 10px 50px 10px 20px;
      }
    }

    /* Responsive: Mobile */
    @media (max-width: 640px) {
      :root {
        --eb-topbar-font-size: 13px;
      }

      .eb-topbar__container {
        padding: 12px 44px 12px 16px;
      }

      .eb-topbar__content {
        flex-direction: column;
        gap: 10px;
      }

      .eb-topbar__text {
        text-align: center;
      }

      .eb-topbar__cta {
        padding: 8px 20px;
      }

      .eb-topbar__close {
        right: 10px;
      }
    }

    /* Accessibility: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .eb-topbar__cta,
      .eb-topbar__close {
        transition: none;
      }
    }
  </style>
</head>
<body>

<div class="eb-topbar" role="banner" aria-label="Ankündigung">
  <div class="eb-topbar__container">
    <div class="eb-topbar__content">
      <p class="eb-topbar__text">
        <span class="eb-topbar__highlight">Weihnachtsaktion bis 31.01:</span>
        bei Eisdielen-Konzept gratis Siebträgermaschine (2 Gr.)
      </p>
      <a href="https://eisbedarf.shop/kontakt/" class="eb-topbar__cta">
        Jetzt Anfragen
      </a>
    </div>
  </div>
  <button
    type="button"
    class="eb-topbar__close"
    aria-label="Ankündigung schließen"
    onclick="this.closest('.eb-topbar').classList.add('eb-topbar--hidden')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
    </svg>
  </button>
</div>

</body>
</html>
