<style>
  /* ============================================
     EISBEDARF CONTACT BAR SECTION
     WordPress-embeddable component
     ============================================ */

  .eb-contact {
    background-color: #1a2f35;
    padding: 35px 80px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    box-sizing: border-box;
  }

  .eb-contact *,
  .eb-contact *::before,
  .eb-contact *::after {
    box-sizing: border-box;
  }

  .eb-contact__container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 40px;
  }

  .eb-contact__cta {
    flex: 0 0 auto;
  }

  .eb-contact__title {
    font-size: 30px;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ffffff;
    margin: 0 0 8px 0;
    line-height: 1.3;
  }

  .eb-contact__subtitle {
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #a0b0b5;
    margin: 0;
    line-height: 1.4;
  }

  .eb-contact__info {
    flex: 0 0 auto;
    text-align: right;
  }

  .eb-contact__line {
    font-size: 16px;
    font-weight: 300;
    color: #ffffff;
    margin: 0;
    line-height: 1.8;
  }

  .eb-contact__line + .eb-contact__line {
    margin-top: 5px;
  }

  .eb-contact__label {
    color: #a0b0b5;
  }

  .eb-contact__link {
    color: #ffffff;
    text-decoration: none;
    transition: color 0.3s ease;
  }

  .eb-contact__link:hover {
    color: #c9a227;
    text-decoration: none;
  }

  .eb-contact__separator {
    color: #a0b0b5;
    margin: 0 8px;
  }

  .eb-contact__name {
    color: #ffffff;
  }

  /* ============================================
     TABLET STYLES (768px - 1199px)
     ============================================ */
  @media (max-width: 1199px) {
    .eb-contact {
      padding: 30px 40px;
    }

    .eb-contact__container {
      gap: 30px;
    }

    .eb-contact__title {
      font-size: 26px;
      letter-spacing: 2px;
    }

    .eb-contact__subtitle {
      font-size: 15px;
    }

    .eb-contact__line {
      font-size: 15px;
    }
  }

  /* ============================================
     MOBILE STYLES (below 768px)
     ============================================ */
  @media (max-width: 767px) {
    .eb-contact {
      padding: 30px 20px;
    }

    .eb-contact__container {
      flex-direction: column;
      text-align: center;
      gap: 25px;
    }

    .eb-contact__cta {
      text-align: center;
    }

    .eb-contact__title {
      font-size: 24px;
    }

    .eb-contact__subtitle {
      font-size: 15px;
    }

    .eb-contact__info {
      text-align: center;
    }

    .eb-contact__line {
      font-size: 15px;
      line-height: 1.7;
    }

    .eb-contact__line + .eb-contact__line {
      margin-top: 8px;
    }
  }

  /* ============================================
     SMALL MOBILE STYLES (below 480px)
     ============================================ */
  @media (max-width: 479px) {
    .eb-contact {
      padding: 25px 15px;
    }

    .eb-contact__container {
      gap: 20px;
    }

    .eb-contact__title {
      font-size: 20px;
      letter-spacing: 1.5px;
    }

    .eb-contact__subtitle {
      font-size: 14px;
      letter-spacing: 1.5px;
    }

    .eb-contact__line {
      font-size: 14px;
      line-height: 1.6;
    }

    .eb-contact__separator {
      display: block;
      visibility: hidden;
      height: 0;
      margin: 0;
    }

    .eb-contact__separator::before {
      content: '';
    }

    /* Stack phone number and name on small screens */
    .eb-contact__line {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .eb-contact__line + .eb-contact__line {
      margin-top: 15px;
    }
  }
</style>

<section class="eb-contact">
  <div class="eb-contact__container">

    <div class="eb-contact__cta">
      <h2 class="eb-contact__title">Haben Sie Fragen?</h2>
      <p class="eb-contact__subtitle">Rufen Sie Uns An!</p>
    </div>

    <div class="eb-contact__info">
      <p class="eb-contact__line">
        <span><span class="eb-contact__label">Mobil:</span> <a href="tel:+4916044930067" class="eb-contact__link">+49 (0) 160 44 93 067</a></span><span class="eb-contact__separator">|</span><span class="eb-contact__name">Vincenzo Penna</span>
      </p>
      <p class="eb-contact__line">
        <span><span class="eb-contact__label">Mobil:</span> <a href="tel:+4917175101377" class="eb-contact__link">+49 (0) 171 75 10 137</a></span><span class="eb-contact__separator">|</span><span class="eb-contact__name">Francesco Landolfo</span>
      </p>
    </div>

  </div>
</section>
